[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ephys_analysis"
version = "0.1.0"
description = "Intrinsic electrophysiology analysis of PMvDAT+ neurons (ABF recordings)"
authors = [{name = "Liam Moran"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyabf>=2.3",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "jupyterlab>=4.0", "ipykernel>=6.25", "seaborn>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
