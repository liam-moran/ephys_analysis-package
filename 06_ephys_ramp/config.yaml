# 06_ephys_ramp configuration.
# Input: the analysis-ready recordings from 02_ephys_anomaly-fix (relative to the repository root).
recordings_table: 02_ephys_anomaly-fix/output/analysis_ready.csv
families: [ramp]                 # A4 / M4 ramp recordings
figure_formats: [png, svg]       # one detection figure per recording, before the feature tables

# Windows and definitions (src/ephys_analysis/ramp.py). Rebound settings match 05_ephys_steps.
ramp:
  pre_window_s: 0.5              # vm_pre: median of the 0.5 s before the up-ramp (spikes removed)
  rin_skip_ms: 50                # Rin from the negative ramp: skip its first 50 ms (membrane lag)
  rebound_peak_window_s: 0.5     # rebound peak: max V in the first 500 ms after release
  rebound_spike_window_s: 5.0    # 'short' rebound spike count: first 5 s after release
  exclude_before_ms: 5           # spikes removed from Vm medians / Rin fit: 5 ms before ...
  exclude_after_ms: 50           # ... to 50 ms after threshold
  burst_max_isi_s: 0.1           # bursts (MaxInterval), as in 05
  burst_min_spikes: 2
  burst_min_ibi_s: 0.2
  command_tol_pA: 1.0            # a command range below 1 pA is not a ramp
  attenuated_prominence_mV: 20.0 # peaks this prominent that are not spikes = attenuated events
  ap_pre_ms: 5.0                 # AP waveform (ap_waveforms.csv): 5 ms before ...
  ap_post_ms: 15.0               # ... to 15 ms after threshold
  rheobase_quiet_s: 0.5          # rheobase: only sweeps with no spike in the 0.5 s before the up-ramp; mean over them

# Spike detection: identical to 04 and 05 (keep in sync)
spikes:
  dvdt_cutoff: 20.0
  min_peak_mV: -20.0
  min_height_mV: 20.0
  max_threshold_to_peak_ms: 5.0
  threshold_fraction: 0.05
  threshold_search_ms: 5.0
  ahp_window_ms: 50.0
  min_valid_upstroke: 50.0
  max_valid_half_width_ms: 5.0
